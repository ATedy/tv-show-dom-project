<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreamBox</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            ink: "#0b1220",
          },
        },
      },
    };
  </script>

  <link href="style.css" rel="stylesheet" />
</head>

<body class="min-h-screen bg-zinc-50 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100">
  <div class="pointer-events-none fixed inset-0 opacity-60">
    <div class="absolute -top-24 left-1/2 h-[32rem] w-[32rem] -translate-x-1/2 rounded-full bg-fuchsia-500/15 blur-3xl">
    </div>
    <div class="absolute top-28 -left-20 h-[28rem] w-[28rem] rounded-full bg-cyan-400/10 blur-3xl"></div>
    <div class="absolute bottom-0 right-0 h-[24rem] w-[24rem] rounded-full bg-emerald-500/10 blur-3xl"></div>
  </div>

  <header
    class="sticky top-0 z-50 border-b border-zinc-200/60 bg-white/70 backdrop-blur dark:border-white/5 dark:bg-zinc-950/70">
    <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-4 px-4 py-3">
      <a href="#browse"
        class="text-base font-semibold tracking-tight text-zinc-900 hover:opacity-90 dark:text-white">StreamBox</a>

      <nav class="flex flex-1 flex-wrap items-center gap-2">
        <button data-nav="browse"
          class="navBtn rounded-full px-3 py-1.5 text-sm text-zinc-700/90 hover:text-zinc-900 hover:bg-zinc-900/5 dark:text-zinc-200/90 dark:hover:text-white dark:hover:bg-white/5">
          Browse
        </button>
        <button data-nav="suggestions"
          class="navBtn rounded-full px-3 py-1.5 text-sm text-zinc-700/90 hover:text-zinc-900 hover:bg-zinc-900/5 dark:text-zinc-200/90 dark:hover:text-white dark:hover:bg-white/5">
          Suggestions
        </button>
        <button data-nav="favourites"
          class="navBtn rounded-full px-3 py-1.5 text-sm text-zinc-700/90 hover:text-zinc-900 hover:bg-zinc-900/5 dark:text-zinc-200/90 dark:hover:text-white dark:hover:bg-white/5">
          Favourites <span id="favCount" class="ml-1 text-emerald-300">(0)</span>
        </button>
        <button data-nav="watch-later"
          class="navBtn rounded-full px-3 py-1.5 text-sm text-zinc-700/90 hover:text-zinc-900 hover:bg-zinc-900/5 dark:text-zinc-200/90 dark:hover:text-white dark:hover:bg-white/5">
          Watch later <span id="laterCount" class="ml-1 text-cyan-300">(0)</span>
        </button>
      </nav>

      <div class="flex items-center gap-2">
        <div id="userStatus" class="hidden items-center gap-2">
          <span id="usernamePill"
            class="rounded-full bg-zinc-900/5 px-3 py-1 text-sm text-zinc-800 dark:bg-white/5 dark:text-zinc-100">User</span>
          <button id="logoutBtn"
            class="rounded-full bg-zinc-900/5 px-3 py-1.5 text-sm text-zinc-900 hover:bg-zinc-900/10 dark:bg-white/10 dark:text-white/90 dark:hover:bg-white/20">
            Logout
          </button>
        </div>
        <button id="themeToggle" type="button"
          class="rounded-full bg-zinc-900/5 px-3 py-1.5 text-sm text-zinc-900 hover:bg-zinc-900/10 dark:bg-white/10 dark:text-white/90 dark:hover:bg-white/20">
          Theme
        </button>
        <button id="loginBtn"
          class="rounded-full bg-zinc-900/5 px-4 py-1.5 text-sm text-zinc-900 hover:bg-zinc-900/10 dark:bg-white/10 dark:text-white/90 dark:hover:bg-white/20">
          Sign in
        </button>
      </div>
    </div>
  </header>

  <div class="relative z-10 mx-auto max-w-7xl px-4 py-6">
    <div id="searchArea" class="mb-4"></div>
    <main id="app"></main>
  </div>

  <!-- Login modal -->
  <div id="loginModal" class="fixed inset-0 z-[100] hidden items-center justify-center p-4" role="dialog"
    aria-modal="true" aria-labelledby="loginTitle">
    <div class="absolute inset-0 bg-black/70"></div>
    <div
      class="relative w-full max-w-md rounded-2xl border border-zinc-200/60 bg-white/90 p-5 shadow-2xl dark:border-white/10 dark:bg-zinc-900">
      <div class="flex items-start justify-between gap-4">
        <div>
          <h2 id="loginTitle" class="text-lg font-semibold text-zinc-900 dark:text-white">
            Sign in
          </h2>
          <p id="loginHelpText" class="mt-1 text-sm text-zinc-600 dark:text-zinc-300/90">
            Simple local login stored in your browser.
          </p>
        </div>
        <button id="closeLoginModalBtn"
          class="rounded-lg px-2 py-1 text-sm text-zinc-600 hover:bg-zinc-900/10 dark:text-zinc-200/80 dark:hover:bg-white/10"
          aria-label="Close" type="button">
          ✕
        </button>
      </div>

      <div
        class="mt-3 flex items-center gap-2 rounded-xl bg-zinc-900/5 p-1 ring-1 ring-zinc-900/5 dark:bg-white/5 dark:ring-white/10">
        <button id="tabSignInBtn" type="button" data-auth-tab="signin"
          class="authTab flex-1 rounded-lg px-3 py-2 text-sm font-medium text-zinc-900 dark:text-zinc-100">
          Sign In
        </button>
        <button id="tabSignUpBtn" type="button" data-auth-tab="signup"
          class="authTab flex-1 rounded-lg px-3 py-2 text-sm font-medium text-zinc-900 dark:text-zinc-100">
          Sign Up
        </button>
      </div>

      <form id="loginForm" class="mt-4 flex flex-col gap-3">
        <label class="flex flex-col gap-1 text-sm">
          <span class="text-zinc-600 dark:text-zinc-200/90">Username</span>
          <input id="loginUsername" autocomplete="username" required
            class="h-10 rounded-xl bg-white/70 px-3 outline-none ring-1 ring-zinc-900/10 focus:ring-emerald-500/50 dark:bg-white/5 dark:ring-white/10"
            placeholder="e.g. alex" />
        </label>
        <label class="flex flex-col gap-1 text-sm">
          <span class="text-zinc-600 dark:text-zinc-200/90">Password</span>
          <input id="loginPassword" type="password" autocomplete="current-password" required
            class="h-10 rounded-xl bg-white/70 px-3 outline-none ring-1 ring-zinc-900/10 focus:ring-emerald-500/50 dark:bg-white/5 dark:ring-white/10"
            placeholder="••••••••" />
        </label>

        <p id="loginError" class="hidden text-sm text-red-500"></p>

        <div class="mt-1 flex items-center justify-end gap-2">
          <button id="cancelLoginBtn" type="button"
            class="rounded-xl bg-zinc-900/5 px-4 py-2 text-sm text-zinc-700 hover:bg-zinc-900/10 dark:bg-white/5 dark:text-zinc-200/90 dark:hover:bg-white/10">
            Cancel
          </button>
          <button id="authSubmitBtn" type="submit"
            class="rounded-xl bg-emerald-500 px-4 py-2 text-sm font-medium text-emerald-950 hover:bg-emerald-400">
            <span id="authSubmitText">Continue</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Data (TVmaze static dataset for shows) -->
  <script src="shows.js"></script>
  <!-- App -->
  <script type="module" src="src/main.js"></script>

  <footer id="copyrightInfo" class="mt-6 pb-6 text-center">
    <h5 class="mx-auto max-w-2xl text-sm text-zinc-500 dark:text-zinc-400">
      This is for educational purposes only. This data is property of
      <a href="https://www.tvmaze.com/" target="_blank"
        class="text-zinc-600 hover:underline dark:text-zinc-300">TVMaze.com</a>
    </h5>
  </footer>
</body>

</html>
